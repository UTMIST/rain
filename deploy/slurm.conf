# Single-node staging cluster on utmist-z1OPA08.
ClusterName=rain
SlurmctldHost=utmist-z1OPA08(127.0.0.1)
SlurmUser=slurm
AuthType=auth/munge
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/var/spool/slurmctld/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
ReturnToService=2

AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=127.0.0.1
AccountingStorageEnforce=associations
AccountingStorageTRES=gres/gpu
JobAcctGatherType=jobacct_gather/linux

# The installed Slurm 21.08 predates cgroup v2 support. Do not change the
# host's cgroup hierarchy; this partition is for trusted staging jobs only.
ProctrackType=proctrack/linuxproc
TaskPlugin=task/affinity
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
DefMemPerCPU=2048
GresTypes=gpu

# Leave memory for the host / k3s. The NVIDIA device plugin is disabled on this
# node so that only Slurm schedules its GPUs.
NodeName=utmist-z1OPA08 NodeAddr=127.0.0.1 CPUs=56 Boards=1 SocketsPerBoard=2 CoresPerSocket=14 ThreadsPerCore=2 RealMemory=120000 Gres=gpu:rtx_a4000:2 State=UNKNOWN
PartitionName=cpu Nodes=utmist-z1OPA08 Default=YES MaxTime=08:00:00 State=UP
