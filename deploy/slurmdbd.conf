# This requires a local MariaDB Unix-socket account named slurm with grants
# limited to slurm_acct_db. Install this file mode 0600, owner slurm:slurm.
AuthType=auth/munge
DbdHost=localhost
DbdAddr=127.0.0.1
PidFile=/run/slurmdbd/slurmdbd.pid
SlurmUser=slurm
StorageType=accounting_storage/mysql
StorageHost=localhost
StorageUser=slurm
StorageLoc=slurm_acct_db
